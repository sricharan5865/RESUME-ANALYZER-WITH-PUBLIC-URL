<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Encrypted Document Vault - Pending Bugs Backlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-input: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --danger: #ef4444;
      --success: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 70%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Lock Screen Container */
    #lock-screen {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px var(--accent-glow);
      text-align: center;
      transition: all 0.3s ease;
    }

    .shield-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 24px var(--accent-glow);
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px var(--accent-glow); transform: scale(1); }
      100% { box-shadow: 0 0 30px var(--accent-glow); transform: scale(1.04); }
    }

    .shield-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #818cf8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 13px 44px 13px 16px;
      color: white;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: var(--text-primary);
    }

    .btn-unlock {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-unlock:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, var(--accent-hover) 0%, #6d28d9 100%);
    }

    .btn-unlock:active {
      transform: translateY(0);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Decrypted Document View */
    #document-view {
      display: none;
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
      margin: 32px 0;
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-color);
    }

    .doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-lock:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Markdown Styling */
    .markdown-body {
      line-height: 1.7;
      font-size: 15px;
      color: #cbd5e1;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #ffffff;
      font-weight: 700;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      letter-spacing: -0.02em;
    }

    .markdown-body h1 { font-size: 26px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-top: 0; }
    .markdown-body h2 { font-size: 20px; color: #818cf8; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 16px; color: #e2e8f0; }

    .markdown-body p { margin-bottom: 1.2em; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 1.2em; padding-left: 24px; }
    .markdown-body li { margin-bottom: 0.5em; }

    .markdown-body code {
      background: #1e293b;
      color: #38bdf8;
      font-family: 'Fira Code', monospace;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .markdown-body pre {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 1.4em;
    }

    .markdown-body pre code {
      background: none;
      color: #f1f5f9;
      padding: 0;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      background: rgba(99, 102, 241, 0.1);
      padding: 14px 18px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: 1.4em;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 28px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5em;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: #1e293b;
      color: white;
    }
  </style>
</head>

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    async function decryptVault(password) {
      const enc = new TextEncoder();
      const passwordKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const salt = hexToBytes(ENCRYPTED_DATA.salt);
      const iv = hexToBytes(ENCRYPTED_DATA.iv);
      const tag = hexToBytes(ENCRYPTED_DATA.tag);
      const ciphertext = hexToBytes(ENCRYPTED_DATA.ciphertext);

      const combinedCiphertext = new Uint8Array(ciphertext.length + tag.length);
      combinedCiphertext.set(ciphertext, 0);
      combinedCiphertext.set(tag, ciphertext.length);

      const key = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        passwordKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuffer = await window.crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv: iv
        },
        key,
        combinedCiphertext
      );

      return new TextDecoder().decode(decryptedBuffer);
    }

    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const errorMsg = document.getElementById('error-msg');
    const lockScreen = document.getElementById('lock-screen');
    const documentView = document.getElementById('document-view');
    const contentDiv = document.getElementById('content');
    const togglePwd = document.getElementById('toggle-pwd');
    const lockBtn = document.getElementById('lock-btn');

    togglePwd.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
    });

    async function handleUnlock() {
      const pwd = passwordInput.value;
      if (!pwd) return;

      errorMsg.style.display = 'none';
      unlockBtn.disabled = true;
      unlockBtn.innerHTML = 'Decrypting...';

      try {
        const decryptedMarkdown = await decryptVault(pwd);
        
        // Render Markdown
        contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(decryptedMarkdown) : `<pre>${decryptedMarkdown}</pre>`;
        
        lockScreen.style.display = 'none';
        documentView.style.display = 'block';
        passwordInput.value = '';
        window.scrollTo(0, 0);
      } catch (err) {
        console.error('Decryption failed:', err);
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      } finally {
        unlockBtn.disabled = false;
        unlockBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
          Unlock Document
        `;
      }
    }

    unlockBtn.addEventListener('click', handleUnlock);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleUnlock();
    });

    lockBtn.addEventListener('click', () => {
      contentDiv.innerHTML = '';
      documentView.style.display = 'none';
      lockScreen.style.display = 'block';
      passwordInput.focus();
    });
